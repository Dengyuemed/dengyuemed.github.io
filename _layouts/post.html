---
layout: default
---

<article class="post">

  {% if page.image %}
  <div class="post-hero" style="background-image: url('{{ page.image }}');">
    <div class="post-hero-overlay">
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </div>
  {% else %}
    <h1>{{ page.title }}</h1>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
